<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solana Star Catcher</title>
<style>
  :root {
    --purple: #9945FF;
    --green: #14F195;
    --bg1: #0b0614;
    --bg2: #1a0d33;
    --text: #f2ecff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg1) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; }
  header {
    padding: 12px 16px 10px;
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(22px, 5.5vw, 34px);
    letter-spacing: .02em;
    background: linear-gradient(90deg, var(--purple), var(--green));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .hud { display: flex; gap: 10px; justify-content: center; }
  .box {
    flex: 1; max-width: 200px;
    padding: 6px 10px;
    border: 1px solid rgba(153, 69, 255, .6);
    border-radius: 12px;
    background: rgba(153, 69, 255, .12);
  }
  .box .label { font-size: 11px; opacity: .75; letter-spacing: .08em; }
  .box .value { font-size: clamp(22px, 6vw, 30px); font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
  .box.low .value { color: #ff6b8a; }
  #stage {
    position: relative; flex: 1; min-height: 0;
    margin: 0 10px 12px;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(20, 241, 149, .35);
    box-shadow: 0 0 30px rgba(153, 69, 255, .25) inset, 0 0 24px rgba(20, 241, 149, .08);
    background: linear-gradient(180deg, rgba(153,69,255,.10), rgba(20,241,149,.05));
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: rgba(11, 6, 20, .78);
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: clamp(24px, 6vw, 34px); }
  .overlay p { margin: 0; line-height: 1.7; opacity: .9; font-size: clamp(14px, 3.8vw, 16px); }
  .big { font-size: clamp(44px, 14vw, 72px); font-weight: 800; color: var(--green); line-height: 1; }
  .best { color: var(--purple); font-weight: 700; }
  button {
    font: inherit; font-size: 18px; font-weight: 800;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    color: #0b0614;
    background: linear-gradient(90deg, var(--purple), var(--green));
    box-shadow: 0 6px 22px rgba(153, 69, 255, .45);
    transition: transform .12s, box-shadow .12s;
  }
  button:hover { transform: translateY(-2px) scale(1.03); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Solana Star Catcher</h1>
    <div class="hud">
      <div class="box"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="box" id="timeBox"><div class="label">TIME</div><div class="value" id="time">30</div></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>

    <div class="overlay" id="startScreen">
      <h2>星をキャッチしよう！</h2>
      <p>落ちてくる星をタップ／クリックして集めよう。<br>
         小さくて速い星ほど高得点！<br>制限時間は30秒です。</p>
      <button id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <h2>タイムアップ！</h2>
      <div class="big" id="finalScore">0</div>
      <p>ベストスコア：<span class="best" id="bestScore">0</span></p>
      <p id="newRecord" class="best" style="display:none">🎉 ニューレコード！</p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const PURPLE = '#9945FF';
  const GREEN = '#14F195';
  const GAME_SECONDS = 30;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const timeBox = document.getElementById('timeBox');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const newRecordEl = document.getElementById('newRecord');

  let W = 0, H = 0, dpr = 1;
  let stars = [], particles = [], popups = [];
  let bgStars = [];
  let score = 0, timeLeft = GAME_SECONDS;
  let running = false;
  let startTime = 0, lastFrame = 0, spawnTimer = 0;
  let best = 0;

  try { best = parseInt(localStorage.getItem('ssc_best') || '0', 10) || 0; } catch (e) {}

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgStars = Array.from({ length: 50 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + .3, a: Math.random() * .6 + .2
    }));
  }
  window.addEventListener('resize', resize);

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnStar() {
    const base = Math.min(W, H);
    // 小さいほど速く高得点
    const roll = Math.random();
    let tier;
    if (roll < 0.55)      tier = { r: base * 0.075, speed: [90, 150],  pts: 1, color: PURPLE };
    else if (roll < 0.85) tier = { r: base * 0.056, speed: [150, 220], pts: 2, color: GREEN };
    else                  tier = { r: base * 0.040, speed: [230, 320], pts: 3, color: '#ffffff' };
    const r = Math.max(tier.r, 16);
    stars.push({
      x: rand(r + 4, W - r - 4),
      y: -r,
      r,
      vy: rand(tier.speed[0], tier.speed[1]) * (0.85 + (H / 800) * 0.3),
      rot: rand(0, Math.PI * 2),
      vr: rand(-2, 2),
      pts: tier.pts,
      color: tier.color,
      sway: rand(0, Math.PI * 2),
      swayAmp: rand(0, 25)
    });
  }

  function starPath(c, x, y, r, rot) {
    const spikes = 5, inner = r * 0.46;
    c.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 === 0 ? r : inner;
      const a = rot + (Math.PI / spikes) * i - Math.PI / 2;
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
    }
    c.closePath();
  }

  function drawStar(s) {
    ctx.save();
    ctx.shadowColor = s.color === '#ffffff' ? GREEN : s.color;
    ctx.shadowBlur = 18;
    const g = ctx.createLinearGradient(s.x - s.r, s.y - s.r, s.x + s.r, s.y + s.r);
    if (s.color === PURPLE)      { g.addColorStop(0, PURPLE); g.addColorStop(1, '#c79bff'); }
    else if (s.color === GREEN)  { g.addColorStop(0, GREEN);  g.addColorStop(1, '#a8ffd9'); }
    else                         { g.addColorStop(0, '#ffffff'); g.addColorStop(1, GREEN); }
    ctx.fillStyle = g;
    starPath(ctx, s.x, s.y, s.r, s.rot);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.stroke();
    ctx.restore();
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 220);
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: rand(.35, .7), r: rand(2, 4.5),
        color: Math.random() < .5 ? color : (color === PURPLE ? GREEN : PURPLE)
      });
    }
  }

  function setScore(v) {
    score = v;
    scoreEl.textContent = score;
  }

  function handlePointer(e) {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    // 手前（後から生成された星）を優先、タップしやすいよう少し広めの判定
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      const dx = x - s.x, dy = y - s.y;
      const hit = s.r * 1.25 + 8;
      if (dx * dx + dy * dy <= hit * hit) {
        stars.splice(i, 1);
        setScore(score + s.pts);
        burst(s.x, s.y, s.color === '#ffffff' ? GREEN : s.color);
        popups.push({ x: s.x, y: s.y, text: '+' + s.pts, life: 0, max: .7 });
        return;
      }
    }
  }
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); handlePointer(e); });

  function update(dt) {
    // スポーン（時間経過で少しずつ増える）
    const elapsed = GAME_SECONDS - timeLeft;
    const interval = Math.max(0.32, 0.72 - elapsed * 0.012);
    spawnTimer += dt;
    while (spawnTimer >= interval) { spawnTimer -= interval; spawnStar(); }

    for (const s of stars) {
      s.y += s.vy * dt;
      s.sway += dt * 2;
      s.x += Math.sin(s.sway) * s.swayAmp * dt;
      s.rot += s.vr * dt;
    }
    stars = stars.filter(s => s.y - s.r < H + 10);

    for (const p of particles) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    }
    particles = particles.filter(p => p.life < p.max);
    for (const p of popups) { p.life += dt; p.y -= 40 * dt; }
    popups = popups.filter(p => p.life < p.max);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const b of bgStars) {
      ctx.globalAlpha = b.a;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of stars) drawStar(s);

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = '800 22px -apple-system, "Hiragino Sans", sans-serif';
    ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = GREEN;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    if (!lastFrame) lastFrame = now;
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    if (running) {
      const remain = GAME_SECONDS - (now - startTime) / 1000;
      timeLeft = Math.max(0, remain);
      timeEl.textContent = Math.ceil(timeLeft);
      timeBox.classList.toggle('low', timeLeft <= 5);
      update(dt);
      if (timeLeft <= 0) endGame();
    } else {
      // 待機中も演出だけ更新
      for (const p of particles) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      particles = particles.filter(p => p.life < p.max);
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    stars = []; particles = []; popups = [];
    setScore(0);
    timeLeft = GAME_SECONDS;
    timeEl.textContent = GAME_SECONDS;
    timeBox.classList.remove('low');
    spawnTimer = 0;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    running = true;
    startTime = performance.now();
    lastFrame = 0;
  }

  function endGame() {
    running = false;
    stars = [];
    timeEl.textContent = '0';
    let isNew = false;
    if (score > best) {
      best = score; isNew = true;
      try { localStorage.setItem('ssc_best', String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    newRecordEl.style.display = isNew && score > 0 ? 'block' : 'none';
    endScreen.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  // iOS Safari のダブルタップ拡大・ピンチ防止
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
